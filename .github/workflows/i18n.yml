name: I18n

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locales:
    name: Locale Structure Validation
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Validate locale files
        run: ruby scripts/validate_locales.rb
